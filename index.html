<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidy – Home Cleaning Checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e38804">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tidy">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --tangerine:#e38804;--sage:#b4c89e;--plum:#a64458;--aqua:#5ab0b5;--caramel:#c3851c;--blush:#e8a3a8;
  --bg:#fbf4e8;--card:#fffaf2;--ink:#3a1f26;--muted:#85666c;--line:#ecdcc6;--accent:var(--tangerine);--on-accent:#2b1500;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22141a;--card:#2f1c24;--ink:#fbeee3;--muted:#c3a1a6;--line:#46303a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#22141a;--card:#2f1c24;--ink:#fbeee3;--muted:#c3a1a6;--line:#46303a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:800}
h1 span{color:var(--plum)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:5px;border-radius:18px}
.tab{border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;font-size:16px;background:transparent;color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.days[hidden]{display:none}
.day{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 0 7px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.day .dn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.day .dd{font-size:18px;font-weight:800}
.day .pb{width:70%;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.day .pb b{display:block;height:100%;background:var(--sage);width:0;transition:width .4s}
.day.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--plum)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on .dn{color:var(--on-accent);opacity:.8}
.day.on .pb{background:rgba(0,0,0,.18)}
.day.on .pb b{background:#fff}
.hero{margin:16px 0;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;transition:background .3s}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.hero h2{margin:0;font-size:20px}
.hero p{margin:3px 0 0;font-size:14px;opacity:.85}
.bar{display:flex;gap:8px;margin-bottom:6px}
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:12px;cursor:pointer}
.btn.on{background:var(--plum);border-color:var(--plum);color:#fff}
h3.sec{margin:16px 2px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
h3.sec small{text-transform:none;letter-spacing:0;font-weight:500}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--accent);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;transition:.2s}
.chk svg{width:16px;height:16px;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.2s;stroke:#2b3a1d}
li.done .chk{background:var(--sage);border-color:var(--sage)}
li.done .chk svg{opacity:1;transform:none}
li .t{flex:1;font-size:17px;cursor:pointer;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li input.edit{flex:1;font:inherit;font-size:16px;border:0;border-bottom:2px solid var(--blush);background:transparent;color:var(--ink);padding:4px 2px;min-width:0;outline:none}
.ic{border:0;background:transparent;color:var(--muted);font-size:18px;padding:6px;cursor:pointer;border-radius:8px}
.none{color:var(--muted);font-size:14px;padding:4px 2px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:18px}
.add select{grid-column:1/-1;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.add input{min-width:0;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:2px dashed var(--blush);background:var(--card);color:var(--ink);outline:none}
.add button{border:0;background:var(--plum);color:#fff;font:inherit;font-weight:700;border-radius:14px;padding:0 18px;cursor:pointer}
.foot{display:flex;gap:8px;margin-top:20px}
.foot .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:26px 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-140%);background:var(--plum);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;z-index:60;transition:transform .4s cubic-bezier(.2,1.4,.4,1);box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
#big{position:fixed;inset:0;z-index:55;display:none;place-items:center;background:rgba(58,31,38,.72);padding:24px}
#big.show{display:grid}
.panel{background:linear-gradient(160deg,var(--tangerine),var(--plum));color:#fff;border-radius:30px;padding:34px 26px;text-align:center;max-width:360px;animation:boom .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes boom{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.panel .em{font-size:72px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(14deg) scale(1.15)}}
.panel h3{font-size:32px;margin:6px 0;letter-spacing:-.02em}
.panel p{margin:0 0 20px;font-size:17px;opacity:.95}
.panel button{border:0;background:#fff;color:var(--plum);font:inherit;font-weight:800;font-size:17px;padding:13px 28px;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="big"><div class="panel"><div class="em">🏡</div><h3>Spotless!</h3><p>Today's list <em>and</em> the weekly list are done. Go put your feet up.</p><button id="bigx">Sparkle on ✨</button></div></div>

<div class="app">
  <h1>Tidy<span>.</span></h1>
  <div class="sub" id="date"></div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-t="daily">☀️ Daily</button>
    <button class="tab" data-t="weekly">🗓️ Weekly</button>
  </div>
  <div class="days" id="days"></div>
  <div class="hero">
    <div class="ring"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="8"/><circle id="arc" cx="36" cy="36" r="30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" style="transition:stroke-dashoffset .5s"/></svg><b id="pct">0%</b></div>
    <div><h2 id="hh"></h2><p id="hp"></p></div>
  </div>
  <div class="bar"><button class="btn" id="editBtn">✏️ Edit lists</button></div>
  <div id="lists"></div>
  <div class="add">
    <select id="target" aria-label="Assign to"></select>
    <input id="newT" placeholder="Add a task…" enterkeyhint="done">
    <button id="addB">Add</button>
  </div>
  <div class="foot">
    <button class="btn" id="resetL">↺ Uncheck all</button>
    <button class="btn" id="defaults">Restore defaults</button>
  </div>
</div>

<script>
(function(){
const NAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DEF={
 every:["Make the bed","Load / run the dishwasher","Wipe kitchen counters","Sweep kitchen floor","Quick tidy of living room","Wipe bathroom sink & counter"],
 days:[
  ["Vacuum living areas","Wipe baseboards"],
  ["Clean toilets","Scrub shower & tub"],
  ["Dust all surfaces","Take out trash & recycling"],
  ["Mop hard floors","Clean mirrors & glass"],
  ["Change bed sheets","Vacuum bedrooms"],
  ["Wipe down appliances","Clean microwave inside"],
  ["Clear out the fridge","Empty all trash bins","Plan the week ahead"]
 ],
 weekly:["Wash & fold laundry","Wipe light switches & door handles","Clean windowsills","Tidy entryway & shoes","Wash bath mats & towels"]
};
const KEY="tidy-v2";let uid=0;const nid=()=>Date.now()+(++uid);
const mkE=a=>a.map(t=>({id:nid(),t,dd:[0,0,0,0,0,0,0].map(()=>false)}));
const mkD=a=>a.map(t=>({id:nid(),t,d:false}));
const wkKey=()=>{const n=new Date(),x=new Date(n.getFullYear(),n.getMonth(),n.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
const todayIdx=(new Date().getDay()+6)%7;
const fresh=()=>({every:mkE(DEF.every),days:DEF.days.map(mkD),weekly:mkD(DEF.weekly),wk:wkKey(),cel:{}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.every)S=fresh();
if(S.wk!==wkKey()){ // new week: uncheck everything
  S.every.forEach(i=>i.dd=i.dd.map(()=>false));S.days.forEach(a=>a.forEach(i=>i.d=false));S.weekly.forEach(i=>i.d=false);S.wk=wkKey();S.cel={};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab="daily",sel=todayIdx,editing=false;
const $=id=>document.getElementById(id);
const root=document.documentElement;
$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
// dates for this week's strip
const mon=new Date();mon.setDate(mon.getDate()-todayIdx);
const dateNum=i=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.getDate()};

const isDone=(it,kind)=>kind==="e"?it.dd[sel]:it.d;
const setDone=(it,kind,v)=>{if(kind==="e")it.dd[sel]=v;else it.d=v};
const dayTotals=di=>{let t=S.every.length+S.days[di].length,d=S.every.filter(i=>i.dd[di]).length+S.days[di].filter(i=>i.d).length;return{t,d}};
const dayAll=di=>{const x=dayTotals(di);return x.t>0&&x.d===x.t};
const weekAll=()=>S.weekly.length>0&&S.weekly.every(i=>i.d);

function render(){
  const daily=tab==="daily";
  root.style.setProperty("--accent",daily?"var(--tangerine)":"var(--aqua)");
  root.style.setProperty("--on-accent",daily?"#2b1500":"#06282b");
  document.querySelector('meta[name=theme-color]').content=daily?"#e38804":"#5ab0b5";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  // day strip
  const ds=$("days");ds.hidden=!daily;ds.innerHTML="";
  NAMES.forEach((n,i)=>{
    const x=dayTotals(i),p=x.t?Math.round(x.d/x.t*100):0;
    const b=document.createElement("button");b.className="day"+(i===sel?" on":"")+(i===todayIdx?" today":"");
    b.setAttribute("aria-label",FULL[i]+", "+p+"% done");
    b.innerHTML='<span class="dn">'+n+'</span><span class="dd">'+dateNum(i)+'</span><i class="pb"><b style="width:'+p+'%"></b></i>';
    b.onclick=()=>{sel=i;render()};ds.appendChild(b);
  });
  // progress
  let done,total;
  if(daily){const x=dayTotals(sel);done=x.d;total=x.t}else{total=S.weekly.length;done=S.weekly.filter(i=>i.d).length}
  const pct=total?Math.round(done/total*100):0;
  $("pct").textContent=pct+"%";$("arc").style.strokeDashoffset=188.5*(1-pct/100);
  const who=sel===todayIdx?"Today":FULL[sel];
  $("hh").textContent=pct===100&&total?(daily?(sel===todayIdx?"Day conquered! 🎉":FULL[sel]+" done! 🎉"):"Week conquered! 🎉"):(daily?(sel===todayIdx?"Today's tasks":FULL[sel]+"'s tasks"):"Anytime this week");
  $("hp").textContent=total?done+" of "+total+" done":"Add your first task below";
  $("editBtn").textContent=editing?"✓ Done editing":"✏️ Edit lists";$("editBtn").classList.toggle("on",editing);
  // lists
  const box=$("lists");box.innerHTML="";
  if(daily){
    section(box,"Every day",editing?"edits apply to all days":"",S.every,"e");
    section(box,FULL[sel]+" only","",S.days[sel],"d");
  }else section(box,"","",S.weekly,"w");
  // add target
  const tg=$("target");tg.style.display=daily?"":"none";
  if(daily){const keep=tg.value;tg.innerHTML="";
    [["one","Just "+FULL[sel]],["every","Every day"],["wkdays","Weekdays (Mon–Fri)"],["wkend","Weekend (Sat–Sun)"]].forEach(([v,l])=>{const o=document.createElement("option");o.value=v;o.textContent=l;tg.appendChild(o)});
    if(keep)tg.value=keep;}
}
function section(box,title,note,arr,kind){
  if(title&&!arr.length&&!editing)return;
  if(title){const h=document.createElement("h3");h.className="sec";h.innerHTML="<span></span><small></small>";h.firstChild.textContent=title;h.lastChild.textContent=note;box.appendChild(h)}
  const ul=document.createElement("ul");
  if(!arr.length){const n=document.createElement("div");n.className=title?"none":"empty";n.textContent=title?"Nothing assigned to this day yet":"Nothing here yet 🌿";box.appendChild(n);return}
  arr.forEach((it,idx)=>{
    const dn=kind==="w"?it.d:isDone(it,kind);
    const li=document.createElement("li");if(dn)li.className="done";
    const c=document.createElement("button");c.className="chk";c.setAttribute("aria-label","Toggle "+it.t);
    c.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    c.onclick=()=>toggle(it,kind);li.appendChild(c);
    if(editing){
      const inp=document.createElement("input");inp.className="edit";inp.value=it.t;
      inp.onchange=()=>{const v=inp.value.trim();if(v){it.t=v;save()}else inp.value=it.t};li.appendChild(inp);
      const mb=(txt,fn,lab)=>{const b=document.createElement("button");b.className="ic";b.textContent=txt;b.setAttribute("aria-label",lab);b.onclick=fn;li.appendChild(b)};
      mb("↑",()=>{mv(arr,idx,-1)},"Move up");mb("↓",()=>{mv(arr,idx,1)},"Move down");mb("🗑",()=>{arr.splice(idx,1);clearCel();save();render()},"Delete");
    }else{const t=document.createElement("span");t.className="t";t.textContent=it.t;t.onclick=()=>toggle(it,kind);li.appendChild(t)}
    ul.appendChild(li);
  });
  box.appendChild(ul);
}
function mv(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function clearCel(){S.cel={}}
function toggle(it,kind){
  const v=!(kind==="w"?it.d:isDone(it,kind));
  if(kind==="w")it.d=v;else setDone(it,kind,v);
  for(let i=0;i<7;i++)if(!dayAll(i))delete S.cel["d"+i];
  if(!weekAll())delete S.cel.w;
  if(!(weekAll()&&dayAll(todayIdx)))delete S.cel.all;
  save();render();
  if(!v)return;
  const key=tab==="daily"?"d"+sel:"w",complete=tab==="daily"?dayAll(sel):weekAll();
  if(complete&&!S.cel[key]){
    S.cel[key]=true;
    if(weekAll()&&dayAll(todayIdx)&&!S.cel.all){S.cel.all=true;save();bigParty()}
    else{save();smallParty()}
  }
}
// ---------- celebrations ----------
const cv=$("fx"),cx=cv.getContext("2d");let P=[],raf=0;
const COLS=["#e38804","#b4c89e","#a64458","#5ab0b5","#c3851c","#e8a3a8"];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",size);size();
function burst(x,y,n,spread,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2-(spread<6?Math.PI/2:0),v=(Math.random()*.6+.4)*power;
    P.push({x,y,vx:Math.cos(a)*v*(spread/6.28+.3),vy:Math.sin(a)*v-(spread<6?power*.5:0),r:Math.random()*6+4,c:COLS[Math.random()*6|0],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sh:Math.random()<.5});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);const d=devicePixelRatio;
  P=P.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of P){
    p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0045;
    cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.life*2);cx.fillStyle=p.c;
    if(p.sh){cx.beginPath();cx.arc(0,0,p.r*d*.6,0,7);cx.fill()}else cx.fillRect(-p.r*d/2,-p.r*d/3,p.r*d,p.r*d*.6);
    cx.restore();
  }
  raf=P.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800)}
function smallParty(){
  toast(tab==="daily"?"🎉 "+FULL[sel]+" complete!":"🎉 Weekly list complete!");
  burst(innerWidth/2,innerHeight*.45,120,6.28,12);
  setTimeout(()=>{burst(innerWidth*.2,innerHeight,60,3,16);burst(innerWidth*.8,innerHeight,60,3,16)},250);
  if(navigator.vibrate)try{navigator.vibrate([60,40,60])}catch(e){}
}
function bigParty(){
  $("big").classList.add("show");
  let n=0;const iv=setInterval(()=>{
    burst(Math.random()*innerWidth,innerHeight*(.2+Math.random()*.3),90,6.28,13);
    burst(Math.random()<.5?0:innerWidth,innerHeight,50,3,19);
    if(++n>9)clearInterval(iv);
  },300);
  if(navigator.vibrate)try{navigator.vibrate([100,50,100,50,200])}catch(e){}
}
$("bigx").onclick=()=>$("big").classList.remove("show");
// ---------- controls ----------
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("editBtn").onclick=()=>{editing=!editing;render()};
function add(){
  const v=$("newT").value.trim();if(!v)return;
  if(tab==="weekly")S.weekly.push({id:nid(),t:v,d:false});
  else{
    const w=$("target").value;
    if(w==="every")S.every.push(mkE([v])[0]);
    else{const ds=w==="one"?[sel]:w==="wkdays"?[0,1,2,3,4]:[5,6];ds.forEach(i=>S.days[i].push(mkD([v])[0]))}
  }
  $("newT").value="";clearCel();save();render();
}
$("addB").onclick=add;$("newT").onkeydown=e=>{if(e.key==="Enter")add()};
$("resetL").onclick=()=>{
  if(tab==="weekly")S.weekly.forEach(i=>i.d=false);
  else{S.every.forEach(i=>i.dd[sel]=false);S.days[sel].forEach(i=>i.d=false)}
  clearCel();save();render();
};
$("defaults").onclick=()=>{
  if(tab==="weekly"){if(confirm("Replace the weekly list with the defaults?")){S.weekly=mkD(DEF.weekly);clearCel();save();render()}}
  else if(confirm("Replace every-day tasks and all day assignments with the defaults?")){S.every=mkE(DEF.every);S.days=DEF.days.map(mkD);clearCel();save();render()}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.wk!==wkKey())location.reload()});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>
